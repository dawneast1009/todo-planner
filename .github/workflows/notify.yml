name: Notify

# 5분마다 알림 보낼 게 있는지 확인한다.
# GitHub 예약 실행은 붐빌 때 몇 분씩 늦을 수 있다.
# 공개 레포에서 60일 동안 커밋이 없으면 GitHub이 예약 실행을 멈추니, 그때는 Actions 탭에서 다시 켠다.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vite build -c vite.notify.config.ts
      - run: node dist-notify/notify.js
        env:
          # Firebase 콘솔 → 프로젝트 설정 → 서비스 계정 → 새 비공개 키 (JSON 전체)
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
